name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: pin
        shell: python
        run: |
          import json, os
          from pathlib import Path
          value = json.loads(Path('vendor/core.lock.json').read_bytes())['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + value + '\n')
  test:
    needs: pairing
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Full history of Core at the locked commit, so the lock is verified
      # against Git objects (not only against the vendored bytes).
      - uses: actions/checkout@v7
        with:
          repository: Iris0fTheValley/Thaliris
          path: shared-core
          ref: ${{ needs.pairing.outputs.commit }}
          fetch-depth: 0
      - name: Selected Core identity
        run: 'git -C shared-core show -s --format="Core commit: %H%nSubject: %s" HEAD'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Core is vendored under vendor/ and pinned by vendor/core.lock.json; the
      # suite imports it from there, so the thaliris dependency is not resolved
      # from an index (--no-deps) and only the test extra is installed explicitly.
      - run: python -m pip install 'pytest>=8.0'
      - run: python -m pip install --no-deps -e .
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - name: Vendored Core matches its lock
        run: python scripts/vendor_core.py --check --source shared-core
      # Includes the generated-agent / role-table drift check (tests/test_roles.py).
      - name: Test suite
        if: ${{ !cancelled() }}
        run: python -m pytest --junitxml=results/tests.xml
        env:
          THALIRIS_CORE_SOURCE: ${{ github.workspace }}/shared-core
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python }}
          path: results/*.xml
