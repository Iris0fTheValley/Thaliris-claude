[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thaliris-claude"
version = "0.4.3"
description = "Claude Code Host adapter for the shared Thaliris Core"
dependencies = ["thaliris>=0.5.2,<0.6"]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Thaliris contributors"}]
keywords = ["context", "lifecycle", "claude-code", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
thaliris-claude = "thaliris_claude.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/thaliris_claude"]
